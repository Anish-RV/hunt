name = "sf-scav-hunt-leaderboard-proxy"
main = "worker.js"
compatibility_date = "2026-10-06"

[vars]
ALLOWED_ORIGIN = "https://sanfranciscohunt.com,http://localhost:3000"
SHEET_RANGE = "leaderboard_external!A:Z"
TEAMS_RANGE = "Teams!A:Z"
FORM_DATA_RANGE = "'Form Data'!A:AZ"
FINISH_RANGE = "'Finish Data'!A:Z"
PHOTO_LEADERBOARD_RANGE = "'Photo Leaderboard'!A:Z"
PHOTO_DATA_RANGE = "'Photo Data'!A:Z"

[observability.logs]
enabled = true
invocation_logs = true